[project]
name = "p1s-controller"
version = "0.1.0"
description = "Local-only (no cloud) controller for the Bambu Lab P1S + AMS"
requires-python = ">=3.10"
dependencies = ["paho-mqtt>=2.0", "keyring>=24"]

[project.optional-dependencies]
ui = ["PySide6>=6.6", "pyqtgraph>=0.13", "numpy", "PyOpenGL>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
p1s = "p1s_controller.cli:main"

[project.gui-scripts]
p1s-gui = "p1s_controller.ui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["p1s_controller", "p1s_controller.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
