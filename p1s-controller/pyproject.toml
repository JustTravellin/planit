[project]
name = "p1s-controller"
version = "0.1.0"
description = "Local-only (no cloud) controller for the Bambu Lab P1S + AMS"
requires-python = ">=3.10"
dependencies = ["paho-mqtt>=2.0", "keyring>=24"]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
p1s = "p1s_controller.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["p1s_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
